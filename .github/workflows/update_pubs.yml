name: Update publications and deploy website
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      force_sdg_refresh:
        description: Reclassify SDGs without overwriting manual assignments
        type: boolean
        default: false
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: academic-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHOW_SCOPUS_METRICS: ${{ vars.SHOW_SCOPUS_METRICS }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Refresh publication archive
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FORCE_SDG_REFRESH: ${{ inputs.force_sdg_refresh }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          SCOPUS_INST_TOKEN: ${{ secrets.SCOPUS_INST_TOKEN }}
        run: |
          set +e
          python updater.py
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo '::warning::Publication refresh incomplete. Last valid data retained. Inspect updater log and API access.'
            echo 'Publication refresh incomplete; last valid data preserved.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Upload SDG classification report
        if: github.event_name != 'push' && always()
        uses: actions/upload-artifact@v7
        with:
          name: sdg-classification-report
          path: sdg_report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Refresh public GitHub repository list
        run: python tools/github_repos.py
      - name: Build static site
        run: python tools/build.py --stage
      - name: Commit refreshed archive and generated HTML
        run: |
          git config user.name 'academic-site[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add publications.json index.html
          if [ -f repositories.json ]; then git add repositories.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh publication archive and website'
            git push
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

